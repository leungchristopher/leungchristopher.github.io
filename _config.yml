# Site
title: "Chris Leung"
name: "Chris Leung"
author: "Chris Leung"
email: chcl4@cam.ac.uk
description: "Machine learning and genetics at Cambridge."
url: "https://leungchristopher.com"
repository: "leungchristopher/leungchristopher.github.io"

# The date of the first dlog entry. Used on the log page to compute
# "days since starting". Update this if you re-start the log from scratch.
dlog_start: "2026-07-27"

# Build settings
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

# Essays collection, plus dlog: one plain markdown file per day, in _dlog/.
collections:
  essays:
    output: true
    permalink: /essays/:name/
  dlog:
    output: true
    permalink: /dlog/:name/

# Contact / social (rendered in the footer)
social:
  email: "mailto:chcl4@cam.ac.uk"
  github: "https://github.com/leungchristopher"
  linkedin: "https://www.linkedin.com/in/christopherhcleung"
  x: "https://x.com/chrishcleung"
  substack: "https://leungchristopher.substack.com/"

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: essays
    values:
      layout: post
      math: true
  - scope:
      path: ""
      type: dlog
    values:
      layout: dlog

feed:
  collections:
    essays: {}

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
