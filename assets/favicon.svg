<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>cl</title>
  <style>
    circle { fill: #171717; }
    @media (prefers-color-scheme: dark) {
      circle { fill: #f5f5f5; }
    }
  </style>
  <g>
    <!-- Lowercase c, on a four-unit dot grid. -->
    <circle cx="8" cy="12" r="1.5"/>
    <circle cx="12" cy="12" r="1.5"/>
    <circle cx="4" cy="16" r="1.5"/>
    <circle cx="4" cy="20" r="1.5"/>
    <circle cx="4" cy="24" r="1.5"/>
    <circle cx="8" cy="28" r="1.5"/>
    <circle cx="12" cy="28" r="1.5"/>
    <!-- Lowercase l, with a full-height stem and a short foot. -->
    <circle cx="20" cy="4" r="1.5"/>
    <circle cx="20" cy="8" r="1.5"/>
    <circle cx="20" cy="12" r="1.5"/>
    <circle cx="20" cy="16" r="1.5"/>
    <circle cx="20" cy="20" r="1.5"/>
    <circle cx="20" cy="24" r="1.5"/>
    <circle cx="24" cy="28" r="1.5"/>
    <circle cx="28" cy="28" r="1.5"/>
  </g>
</svg>
