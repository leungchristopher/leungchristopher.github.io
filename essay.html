<script>
  // This script runs when the page loads
  document.addEventListener('DOMContentLoaded', function() {
    const essayContentEl = document.getElementById('essay-content');
    const params = new URLSearchParams(window.location.search);
    const fileName = params.get('file'); // Gets 'on-the-unknown' from the URL

    if (!fileName) {
      essayContentEl.textContent = 'Error: No essay file specified.';
      return;
    }

    // Fetch the corresponding .txt file
    fetch(`${fileName}.txt`)
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.text();
      })
      .then(text => {
        // Format the fetched text and display it
        essayContentEl.textContent = formatText(text, 80);
      })
      .catch(error => {
        console.error('Error fetching essay:', error);
        essayContentEl.textContent = `Could not load essay: "${fileName}.txt". Please ensure the file exists.`;
      });
  });

  /**
   * Wraps text to a specified character width without breaking words.
   * @param {string} text - The input text.
   * @param {number} maxWidth - The maximum line width.
   * @returns {string} The formatted text.
   */
  function formatText(text, maxWidth) {
    const lines = text.split('\n');
    let formattedText = '';

    lines.forEach(line => {
      if (line.length <= maxWidth) {
        formattedText += line + '\n';
        return;
      }
      
      let currentLine = '';
      const words = line.split(' ');
      
      words.forEach(word => {
        if ((currentLine + word).length > maxWidth) {
          formattedText += currentLine.trim() + '\n';
          currentLine = word + ' ';
        } else {
          currentLine += word + ' ';
        }
      });
      formattedText += currentLine.trim() + '\n';
    });
    
    return formattedText;
  }
</script>
