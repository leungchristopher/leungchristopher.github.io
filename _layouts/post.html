---
layout: default
---
<article class="essay">
  <header class="essay-header">
    <h1 class="essay-title">{{ page.title }}</h1>
    {% if page.date %}
    <time class="essay-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    {% endif %}
  </header>

  <div class="essay-body">
    {{ content }}
  </div>

  <p class="essay-back"><a href="{{ '/essays/' | relative_url }}">All essays</a></p>
</article>

{% include toc.html %}
