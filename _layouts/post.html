---
layout: default
---

<div class="post-toc" id="postToc">
  <p class="toc-post-title">{{ page.title }}</p>
  <nav id="tocNav"></nav>
</div>

<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-header-meta">
      <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags.size > 0 %}
      <div class="post-list-tags">
        {% for tag in page.tags %}
        <a href="/tags/#{{ tag | slugify }}" class="tag-chip">{{ tag }}</a>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </header>

  <div class="post-content" id="postContent">
    {{ content }}
  </div>
</article>

<script>
(function() {
  var toc = document.getElementById('tocNav');
  var content = document.getElementById('postContent');
  var tocContainer = document.getElementById('postToc');
  if (!toc || !content) return;

  var headings = Array.from(content.querySelectorAll('h1'));
  if (headings.length === 0) {
    headings = Array.from(content.querySelectorAll('h2'));
  }
  if (headings.length === 0) {
    tocContainer.style.display = 'none';
    return;
  }

  headings.forEach(function(h, i) {
    if (!h.id) {
      h.id = 'section-' + i + '-' + h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
    }
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.className = 'toc-link';
    a.textContent = h.textContent;
    toc.appendChild(a);
  });

  var links = Array.from(toc.querySelectorAll('.toc-link'));
  var activeIndex = -1;

  function setActive(index) {
    if (index === activeIndex) return;
    activeIndex = index;
    links.forEach(function(l, i) {
      l.classList.toggle('toc-active', i === index);
    });
  }

  function updateTOC() {
    var active = 0;
    for (var i = headings.length - 1; i >= 0; i--) {
      if (headings[i].getBoundingClientRect().top <= 120) {
        active = i;
        break;
      }
    }
    setActive(active);
  }

  window.addEventListener('scroll', updateTOC, { passive: true });
  updateTOC();
})();
</script>
