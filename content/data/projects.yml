- title: "Spontaneous neuronal activation · 2026–present"
  affil: "Lois group, Caltech"
  desc: "Computational modelling of spontaneous neuronal activity and its role in the restoration of learned behaviours following perturbation. Drawing on attractor network theory and Hebbian plasticity. Also worked on preprocessing of fMRI data (ongoing project). Part of the Cambridge–Caltech exchange, funded by Caltech and St Catharine's College, Cambridge."
  img: /assets/images/projects/lois.svg
  current: true

- title: "Viral ancestral recombination graphs · 2025–present"
  affil: "Department of Genetics, University of Cambridge"
  desc: "Scalable inference of ancestral recombination graphs for viral DNA, using Markov Chain Monte Carlo and perturbation theory. Awarded the J.M. Thoday Prize for the best undergraduate research project."
  img: /assets/images/projects/ebv.webp
  link: "https://github.com/leungchristopher/viralarg"
  link_text: code
  current: true

- title: "Deep learning for genome organisation · 2025–present"
  affil: "Hannon Group, Cancer Research UK Cambridge Institute"
  desc: 'Deep learning for predicting three-dimensional chromatin organisation from sequencing data, in the laboratory of <a href="https://www.cell.com/cell/fulltext/S0092-8674(26)00640-9">Greg Hannon</a>. Work focused on learning sequence determinants of topologically associating domains and compartment structure. Publication in preparation.'
  img: /assets/images/projects/hannon.webp
  link: "https://github.com/leungchristopher/orcafly"
  link_text: code
  current: true

